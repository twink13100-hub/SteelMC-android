
name: SteelMC Android ARM64

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android-arm64.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout SteelMC
        uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-14
          targets: aarch64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build SteelMC for Android ARM64
        run: |
          cargo ndk \
            --target aarch64-linux-android \
            --platform 26 \
            build \
            --release \
            -p steel \
            --no-default-features

      - name: Verify binary
        run: |
          set -euxo pipefail
          BIN="target/aarch64-linux-android/release/steel"
          test -s "$BIN"
          file "$BIN"
          mkdir -p artifacts
          cp "$BIN" artifacts/steel-android-arm64

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: steelmc-android-arm64
          path: artifacts/steel-android-arm64
          if-no-files-found: error
          retention-days: 7
          
